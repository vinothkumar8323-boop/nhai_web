<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90">
  <defs>
    <linearGradient id="nhaiRoadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Shield -->
  <g transform="translate(10, 5)">
    <!-- Base Shield -->
    <path d="M 40 5 L 75 18 L 75 52 Q 75 75 40 85 Q 5 75 5 52 L 5 18 Z" fill="#0A192F" stroke="#F59E0B" stroke-width="2.5" />
    
    <!-- Tricolor Arc Accent -->
    <path d="M 12 22 L 40 12 L 68 22" fill="none" stroke="#FF9933" stroke-width="3" stroke-linecap="round" />
    <path d="M 15 28 L 40 18 L 65 28" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 18 34 L 40 24 L 62 34" fill="none" stroke="#138808" stroke-width="3" stroke-linecap="round" />
    
    <!-- Stylized Highway Road Perspective -->
    <polygon points="40,32 58,74 22,74" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
    <!-- Road Dashed Center Divider -->
    <line x1="40" y1="36" x2="40" y2="44" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
    <line x1="40" y1="49" x2="40" y2="58" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" />
    <line x1="40" y1="63" x2="40" y2="72" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
    
    <!-- Side Highway Guide Pillars -->
    <circle cx="28" cy="68" r="2" fill="#10B981" />
    <circle cx="52" cy="68" r="2" fill="#10B981" />
  </g>

  <!-- Typography -->
  <g transform="translate(95, 20)">
    <!-- Main Acronym & Badge -->
    <text x="0" y="24" font-family="'Inter', 'Outfit', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      NHAI
    </text>
    
    <!-- Division Badge -->
    <rect x="78" y="5" width="135" height="22" rx="4" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="1.2" />
    <text x="86" y="20" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" letter-spacing="1">
      PIU CHENGALPATTU
    </text>
    
    <!-- Full Authority Title -->
    <text x="0" y="44" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
      NATIONAL HIGHWAYS AUTHORITY OF INDIA
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="59" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="0.5">
      MINISTRY OF ROAD TRANSPORT &amp; HIGHWAYS • GOVT. OF INDIA
    </text>
  </g>
</svg>
